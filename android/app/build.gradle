plugins { id 'com.android.application' }
def nikiProfile = providers.gradleProperty('notesProfile').orElse('owner').get() == 'niki'
android {
    namespace 'com.forgeboard.notes'
    compileSdk 36
    defaultConfig {
        applicationId nikiProfile ? 'io.github.trevormw20.forgeboard.notes.niki' : 'io.github.trevormw20.forgeboard.notes'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.3.0'
        buildConfigField 'boolean', 'NIKI_PROFILE', nikiProfile.toString()
        manifestPlaceholders = [appLabel: nikiProfile ? 'Niki Notes' : 'Forgeboard Notes']
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            def keyPath = System.getenv('ANDROID_SIGNING_FILE')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('ANDROID_SIGNING_PASSWORD')
                keyAlias 'forgeboard'
                keyPassword System.getenv('ANDROID_SIGNING_PASSWORD')
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
